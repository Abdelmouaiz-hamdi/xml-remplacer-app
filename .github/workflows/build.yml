name: Build and Package Tkinter App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Cloner le dépôt
      uses: actions/checkout@v3

    - name: Installer Python et les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compiler avec PyInstaller
      run: pyinstaller --onefile --windowed app.py

    - name: Upload de l’exécutable
      uses: actions/upload-artifact@v3
      with:
        name: xml-app
        path: dist/*.exe

    - name: Publier sur GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
